apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// apply plugin: 'com.google.gms.google-services'


react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

project.ext.vectoricons = [
    iconFontNames: ['MaterialIcons.ttf', 'FontAwesome.ttf', 'Ionicons.ttf', 'MaterialCommunityIcons.ttf', 'Fontisto.ttf', 'Entypo.ttf', 'EvilIcons.ttf', 'Feather.ttf', 'Foundation.ttf', 'Octicons.ttf', 'Zocial.ttf'],

]

// This will copy the required fonts from react-native-vector-icons into your APK.
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

android {
    // Make sure these properties (ndkVersion, buildToolsVersion, compileSdkVersion, etc.) are defined in your rootProject.ext
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cropcalendarapp"

    defaultConfig {
        applicationId "com.cropcalendarapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('C:\\Users\\azimk\\my-release-key.keystore') // Update path as needed
            storePassword "azim123"
            keyAlias "my-key-alias"
            keyPassword "azim123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // Resolve duplicate resource issues by specifying which files to pick
    packagingOptions {
        pickFirst 'fonts/MaterialIcons.ttf'
        pickFirst 'fonts/FontAwesome.ttf'
        pickFirst 'fonts/Ionicons.ttf'
    }

    // Optional: Specify resource configurations if you only need specific locales or densities.
    // resourceConfigurations "en" // Uncomment if needed
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.support') {
                details.useVersion "28.0.0"
            }
        }
    }
}

dependencies {
    
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-vector-icons')
    implementation(project(':react-native-push-notification'))
    implementation project(':react-native-background-fetch')
    // implementation platform('com.google.firebase:firebase-bom:33.0.0') // Replace with the latest version if needed
    // implementation 'com.google.firebase:firebase-core'
    

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
