buildscript {
    ext {
        googlePlayServicesVersion = "+" // default: "+"
    firebaseMessagingVersion = "21.1.0" // default: "21.1.0"

    supportLibVersion = "23.1.1" // default: 23.1.1

        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // classpath('com.google.gms:google-services:4.3.3')
        // classpath('com.google.firebase:firebase-crashlytics-gradle:2.9.0')
        // classpath('com.google.firebase:perf-plugin:1.4.0')
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        maven {
            // react-native-background-fetch
            url("${project(':react-native-background-fetch').projectDir}/libs")
        }
        maven {
            // react-native-push-notification
            url("$rootDir/../node_modules/react-native-push-notification/android")
        }
            flatDir {
      dirs("$rootDir/node_modules/react-native-background-fetch/android/libs")
    }

    }
}


apply plugin: "com.facebook.react.rootproject"
